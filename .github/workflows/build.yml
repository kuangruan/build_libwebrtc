name: build
on:
  workflow_dispatch:
    inputs:
      triple:
        description: Triple to build
        required: true
        default: all
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-x86_64
          - linux-arm64
          - windows-x86_64
          - windows-x86
jobs:
  darwin:
    if: ${{ inputs.triple == 'all' || startsWith(inputs.triple, 'darwin-') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            os: macos-15
          - triple: darwin-x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: build
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        env:
          NINJA_JOBS: "4"
        run: ./scripts/build-darwin.sh --triple ${{ matrix.triple }}
      - name: verify
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        run: |
          set -euo pipefail
          ROOT="${LIBWEBRTC_ROOT:-$HOME/.cache/build_libwebrtc}"
          SLICE="$ROOT/m140-7339/${{ matrix.triple }}"
          echo "--- args.gn ---"; cat "$SLICE/args.gn"
          grep -q 'target_os="mac"' "$SLICE/args.gn" || { echo "not a mac slice"; exit 1; }
          case "${{ matrix.triple }}" in
            darwin-arm64) want=arm64 ;;
            darwin-x86_64) want=x86_64 ;;
          esac
          grep -q "target_cpu=\"$want\"" "$SLICE/args.gn" || { echo "not target_cpu=$want"; exit 1; }
          # Before anything is published: the archive has to be this triple's
          # architecture. A Mach-O archive shipped once under a linux-arm64 asset
          # and only failed at a consumer's linker, which is far too late.
          file "$SLICE/lib/libwebrtc.a"
          lipo -info "$SLICE/lib/libwebrtc.a" | tee /tmp/lipo.txt
          grep -q "$want" /tmp/lipo.txt || { echo "${{ matrix.triple }} archive is not $want"; exit 1; }
          if grep -qiE 'Architectures in the fat file' /tmp/lipo.txt; then
            echo "the archive must be thin, not universal"; exit 1
          fi
      - name: pack
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        run: |
          ROOT="${LIBWEBRTC_ROOT:-$HOME/.cache/build_libwebrtc}"
          SLICE="$ROOT/m140-7339/${{ matrix.triple }}"
          tar -C "$SLICE" -c include lib args.gn BUILD_INFO.json | zstd -T0 -o "libwebrtc-m140-${{ matrix.triple }}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        with:
          name: libwebrtc-m140-${{ matrix.triple }}
          path: libwebrtc-m140-${{ matrix.triple }}.tar.zst
          if-no-files-found: error

  windows:
    if: ${{ inputs.triple == 'all' || startsWith(inputs.triple, 'windows-') }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        triple: [windows-x86_64, windows-x86]
    steps:
      - uses: actions/checkout@v4
      - name: build
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        env:
          NINJA_JOBS: "4"
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
          WEBRTC_CHECKOUT: "C:\\w"
        run: .\scripts\build-windows.ps1 -Triple ${{ matrix.triple }}
      - name: pack
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        shell: bash
        run: |
          ROOT="${LIBWEBRTC_ROOT:-$LOCALAPPDATA/build_libwebrtc}"
          SLICE="$ROOT/m140-7339/${{ matrix.triple }}"
          tar -C "$SLICE" -c include lib args.gn BUILD_INFO.json | zstd -T0 -o "libwebrtc-m140-${{ matrix.triple }}.tar.zst"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        with:
          name: libwebrtc-m140-${{ matrix.triple }}
          path: libwebrtc-m140-${{ matrix.triple }}.tar.zst
          if-no-files-found: error

  linux:
    if: ${{ inputs.triple == 'all' || startsWith(inputs.triple, 'linux-') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 runner, cross-compiled -- not the arm64 runner. The clang
          # cipd ships for linux is x86_64 even under the linux-arm64 platform
          # name, so a native arm64 build dies on the first object with
          # "clang++: Exec format error". Cross-compiling with Chromium's own
          # clang (--target=aarch64-linux-gnu plus its arm64 sysroot) is the
          # supported way, and build-linux.sh adds use_sysroot for it.
          - triple: linux-arm64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        env:
          NINJA_JOBS: "4"
        run: ./scripts/build-linux.sh --triple ${{ matrix.triple }}
      - name: verify
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        run: |
          set -euo pipefail
          ROOT="${LIBWEBRTC_ROOT:-$HOME/.cache/build_libwebrtc}"
          SLICE="$ROOT/m140-7339/${{ matrix.triple }}"
          echo "--- args.gn ---"; cat "$SLICE/args.gn"
          grep -q 'target_os="linux"' "$SLICE/args.gn" || { echo "not a linux slice"; exit 1; }
          grep -q 'target_cpu="arm64"' "$SLICE/args.gn" || { echo "not target_cpu=arm64"; exit 1; }
          # Every member, because the failure this guards against shipped: a
          # Mach-O archive under a linux-arm64 asset, which no consumer could
          # link and which cost far more to find than to prevent. Mach-O extracts
          # with ar just as happily, so the check is on what comes out.
          rm -rf /tmp/members && mkdir -p /tmp/members && cd /tmp/members
          ar x "$SLICE/lib/libwebrtc.a"
          total="$(ls | wc -l)"
          bad="$(file * | grep -cv 'ELF 64-bit.*aarch64' || true)"
          echo "members: $total, not ELF/aarch64: $bad"
          # || true: finding nothing is the success case, and grep -v exiting 1
          # would take the whole step down with it under set -e and pipefail.
          file * | grep -v 'ELF 64-bit.*aarch64' | head -5 || true
          [ "$total" -gt 100 ] || { echo "suspiciously few members: $total"; exit 1; }
          [ "$bad" = 0 ] || { echo "this slice is not ELF aarch64; refusing to publish it"; exit 1; }
      - name: pack
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          ROOT="${LIBWEBRTC_ROOT:-$HOME/.cache/build_libwebrtc}"
          SLICE="$ROOT/m140-7339/${{ matrix.triple }}"
          tar -C "$SLICE" -c include lib args.gn BUILD_INFO.json | zstd -T0 -o "libwebrtc-m140-${{ matrix.triple }}.tar.zst"
          # Verify what is about to be published, not the directory that was
          # verified earlier: they differed once -- the packed archive was Mach-O
          # with a timestamp 49 minutes *after* the verify step, which had
          # reported every member ELF aarch64 -- and only the consumer noticed.
          # So: unpack the tarball, and check the archive that comes out of it.
          rm -rf /tmp/packed && mkdir -p /tmp/packed
          tar --zstd -xf "libwebrtc-m140-${{ matrix.triple }}.tar.zst" -C /tmp/packed
          ls -la /tmp/packed/lib
          cd /tmp/packed/lib && ar x libwebrtc.a && cd /tmp/packed/lib
          total="$(ls | wc -l)"
          bad="$(file * | grep -cv 'ELF 64-bit.*aarch64' || true)"
          echo "packed members: $total, not ELF/aarch64: $bad"
          file * | grep -v 'ELF 64-bit.*aarch64' | head -5 || true
          [ "$total" -gt 100 ] || { echo "suspiciously few packed members: $total"; exit 1; }
          [ "$bad" = 0 ] || { echo "the packed archive is not ELF aarch64; refusing to publish it"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.triple == 'all' || inputs.triple == matrix.triple }}
        with:
          name: libwebrtc-m140-${{ matrix.triple }}
          path: libwebrtc-m140-${{ matrix.triple }}.tar.zst
          if-no-files-found: error

  release:
    needs: [darwin, windows, linux]
    if: ${{ always() && !cancelled() && (needs.darwin.result == 'success' || needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libwebrtc-m140-*
          merge-multiple: true
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          TAG="m140-7339-${GITHUB_RUN_NUMBER}"
          NOTES="M140 / branch-heads/7339 slices from run ${GITHUB_RUN_ID}."
          if [ "${{ needs.windows.result }}" != "success" ]; then
            NOTES="$NOTES Windows jobs failed; this tag has no Windows slices."
          fi
          if [ "${{ needs.darwin.result }}" != "success" ]; then
            NOTES="$NOTES Darwin jobs failed; this tag has no Darwin slices."
          fi
          if [ "${{ needs.linux.result }}" != "success" ]; then
            NOTES="$NOTES Linux jobs failed; this tag has no Linux slices."
          fi
          gh release create "$TAG" artifacts/*.tar.zst \
            --repo "${{ github.repository }}" \
            --title "libwebrtc ${TAG}" \
            --notes "$NOTES"
